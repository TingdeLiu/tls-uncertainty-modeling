data:
  ply_path: data/raw/01_3DPrint.ply
  group_directory: data/processed/groups
  group_filename_prefix: Group

preprocessing:
  maximum_absolute_residual_m: 0.01
  minimum_incidence_angle_deg: 10.0
  physical_features:
    - scalar_intensity
    - scalar_incidence
    - scalar_sigma_dist
    - scalar_range_measured

model:
  samples_per_scale: [16, 32, 128]
  mlp_channels:
    - [32, 32, 64]
    - [64, 64, 128]
    - [64, 96, 128]
  physical_feature_count: 4
  hidden_channels: [216, 216, 110, 110]

training:
  seed: 9
  folds: 5
  epochs: 15
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 15
  test_fraction: 0.1
  checkpoint_directory: checkpoints
