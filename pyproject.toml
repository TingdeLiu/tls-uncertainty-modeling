[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umosls-dl"
version = "0.1.0"
description = "Deep-learning uncertainty modelling for static terrestrial laser scanning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tingde Liu", email = "tingde.liu.luh@gmail.com" },
]
keywords = [
  "deep-learning",
  "point-cloud",
  "pointnet",
  "terrestrial-laser-scanning",
  "uncertainty-modelling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "plyfile>=1.0",
  "scikit-learn>=1.2",
  "torch>=2.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
notebook = [
  "jupyterlab>=4.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "seaborn>=0.12",
  "torchmetrics>=1.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/TingdeLiu/UMOSLS-DL"
Repository = "https://github.com/TingdeLiu/UMOSLS-DL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["notebooks/legacy"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
